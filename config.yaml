# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    - '\b(software|backend|back-end|server|java|platform|infrastructure|infra|systems|distributed|cloud|ai|artificial intelligence|genai|generative ai)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end|platform|infrastructure|infra|systems|distributed|cloud|ai|artificial intelligence|genai|generative ai|java)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'backend engineer'
    - 'backend developer'
    - 'java engineer'
    - 'java developer'
    - 'ai engineer'
    - 'ai software engineer'
    - 'artificial intelligence engineer'
    - 'generative ai engineer'
    - 'genai engineer'
    - 'machine learning engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'

    # AI / GenAI roles that are realistically aligned with your existing
    # Java + Spring AI + RAG + LLM + backend experience.
    - '\b(ai|artificial intelligence|genai|generative ai|llm|large language model|rag)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(ai|artificial intelligence|genai|generative ai|llm|large language model|rag)\b'

    # Backend / distributed-systems track — directly aligned with your
    # Spring Boot, REST APIs, Kafka, PostgreSQL, microservices and Kubernetes experience.
    - '\b(network(ing)?\s+)?(software\s+)?engineer\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b.*\bengineer\b'
    - '\bengineer\b.*\b(kernel|packet|dataplane|networking|performance)\b'
    - '\bperformance engineer\b'
    - '\bsystems engineer\b'
    - '\bc\+\+\b.*\bengineer\b'
    - '\bengineer\b.*\bc\+\+\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'      # too senior for now
    - '\bsenior\b'                                                # target ~2-4 year roles
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|trainee)\b'                # too junior
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b' # wrong discipline
    - '\b(data scientist|machine learning scientist|research scientist)\b'

  # Location words matched whole-word against "<location> <title>",
  # case-insensitive. Word boundary matters: substring matching made
  # "india" match "Indiana". Focus on India, with Bangalore/Bengaluru as a
  # priority while still allowing other Indian locations because your resume
  # is based in Delhi-NCR and you are targeting software/AI engineering roles.
  locations:
    - delhi
    - ncr
    - noida
    - gurgaon
    - gurugram
    - faridabad
    - india

  # Regexes (same syntax as include_titles) matched against the LOCATION
  # string only. A match drops the job even if it looks remote or matches a
  # location above — this is what kills "Remote, United States" and
  # "Remote (EMEA)", which are remote jobs you cannot take.
  exclude_locations:
    - '\b(us|usa|u\.s\.?|united states|north america|south america|latam|emea|europe|european union|uk|united kingdom|england|scotland|wales|ireland|canada|singapore|australia|new zealand|germany|poland|brazil|mexico|argentina|chile|colombia|peru|japan|china|south korea|korea|taiwan|vietnam|thailand|indonesia|philippines|malaysia|israel|uae|dubai|saudi|qatar|turkey|russia|ukraine|netherlands|holland|belgium|france|spain|portugal|italy|switzerland|sweden|norway|denmark|finland|estonia|latvia|lithuania|czech|slovakia|hungary|romania|bulgaria|greece|austria|south africa|kenya|nigeria|egypt|pakistan|bangladesh|sri lanka|nepal)\b'

  # If true, a location reading as remote/anywhere passes the location gate.
  # The remote check looks at the location string ONLY — a title like
  # "Distributed Systems Engineer" is not a remote claim.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------

screen_batch_size: 8
screen_jd_chars: 1800
draft_jd_chars: 7000
score_threshold: 7.0
max_per_digest: 5

# --- paths ------------------------------------------------------------------

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv

# Indeed jobs scraped by NaukriResumeUploader, one JSON per line. Absent or
# empty = source disabled; a set path with no file yet is just zero jobs.
indeed_file: /Users/Shared/Files From d.localized/Ollama/Job-application-assistant/indeed-jobs/indeed-jobs.jsonl
